name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests (core logic)
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v5
        with:
          name: vitmap-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APKs (minified, much faster on device)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APKs
        uses: actions/upload-artifact@v5
        with:
          name: vitmap-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  smoke:
    name: Emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: vitmap-release-apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open every tool, run code and edit a photo on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: python3 .github/smoke/smoke.py apks

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-screenshots
          path: smoke-shots/
          if-no-files-found: ignore
